---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: pierogi-os
# description will be included in the image's metadata
description: This is my personal OS image.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/base-main
image-version: 44 # latest is also supported if you want new updates ASAP

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: rpm-ostree
    repos:
      - https://copr.fedorainfracloud.org/coprs/atim/nushell/repo/fedora-%OS_VERSION%/atim-nushell-fedora-%OS_VERSION%.repo
      - https://copr.fedorainfracloud.org/coprs/atim/starship/repo/fedora-%OS_VERSION%/atim-starship-fedora-%OS_VERSION%.repo
      - https://copr.fedorainfracloud.org/coprs/yalter/niri/repo/fedora-%OS_VERSION%/yalter-niri-fedora-%OS_VERSION%.repo
      - https://copr.fedorainfracloud.org/coprs/gladion136/tuxedo-drivers-kmod/repo/fedora-%OS_VERSION%/gladion136-tuxedo-drivers-kmod-fedora-%OS_VERSION%.repo
    install:
      - niri
      - micro
      - j4-dmenu-desktop
      - starship
      - foot
      - kitty
      - kitty-doc
      - kitty-kitten
      - kitty-terminfo
      - kitty-shell-integration
      - tuxedo-drivers-kmod
      - zoxide
      - notmuch
      - direnv
      - nushell
      - waybar
      - openvpn
      - gopass
      - emacs
      - emacsclient
      - isync
      - cliphist
      - maildir-utils
      - printer-driver-brlaser
      - clipman
      - distrobox
      - fzf
      - syncthing
      - nextcloud-client
      - pavucontrol
      - pinentry
      - pinentry-gnome3
      - gum
      - eza
      - wl-kbptr
      - rbw
      - msmtp
      - rlwrap
      - git-lfs
      - vdirsyncer
      - wireguard-tools
      - zathura
      - qemu-system-x86
      - wtype
      - dmenu
      - bat
    remove:
      - firefox
      - firefox-langpacks # also remove firefox dependency (not required for all packages, this is a special case)
  - type: dnf
    install:
      packages:
        - "https://github.com/gopasspw/git-credential-gopass/releases/download/v1.16.1/git-credential-gopass_1.16.1_linux_amd64.rpm"
  - type: default-flatpaks
    configurations:
      - scope: system
        install:
          - org.mozilla.firefox
          - org.gnome.Loupe
          - io.gitlab.librewolf-community
          - com.orcaslicer.OrcaSlicer
          - io.m51.Gelly
          - im.riot.Riot
          - org.gnome.Fractal
          - org.signal.Signal
  - type: chezmoi
    repository: "https://github.com/bascht/dotfiles-public" # my dotfiles repo
    all-users: false
    file-conflict-policy: replace
  - type: fonts
    fonts:
      nerd-fonts:
        - FiraCode # don't add spaces or "Nerd Font" suffix.
        - Hack
        - SourceCodePro
        - Terminus
        - JetBrainsMono
        - NerdFontsSymbolsOnly
        - IosevkaTermSlab
        - Lekton
        - VictorMono
      google-fonts:
        - Roboto
        - Open Sans
      url-fonts:
        - name: MapleMono
          url: https://github.com/subframe7536/maple-font/releases/download/v7.9/MapleMono-NF-unhinted.zip
  - type: signing # this sets up the proper policy & signing files for signed images to work fully
